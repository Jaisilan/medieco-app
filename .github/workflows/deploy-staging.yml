name: Deploy Medieco Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: medieco-staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build staging app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PAYMENT_PROVIDER: chip
          VITE_APP_ENV: staging
          VITE_APP_URL: https://magenta-alpaca-240997.hostingersite.com
        run: npm run build

      - name: Add Hostinger routing rules
        run: cp deployment/hostinger/.htaccess dist/.htaccess

      - name: Deploy to Hostinger over SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SFTP_SERVER }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SFTP_PORT }}
          source: "dist"
          target: ${{ secrets.HOSTINGER_SFTP_DIRECTORY }}
          strip_components: 1
          overwrite: true
