name: Deploy Medieco Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: medieco-staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate staging secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "VITE_SUPABASE_URL is missing"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "VITE_SUPABASE_ANON_KEY is missing"; exit 1; }
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "VITE_SUPABASE_URL must look like https://PROJECT_REF.supabase.co"; exit 1 ;;
          esac

      - name: Build staging app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PAYMENT_PROVIDER: chip
          VITE_APP_ENV: staging
          VITE_APP_URL: https://magenta-alpaca-240997.hostingersite.com
        run: npm run build

      - name: Verify Supabase configuration was embedded
        run: |
          grep -Rqs "supabase.co" dist/assets || {
            echo "Supabase URL was not embedded in the production bundle"
            exit 1
          }

      - name: Add deployment marker and Hostinger routing rules
        run: |
          printf '{"commit":"%s","deployed_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json
          cp deployment/hostinger/.htaccess dist/.htaccess

      - name: Clean previous staging build
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SFTP_SERVER }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SFTP_PORT }}
          script: |
            TARGET='${{ secrets.HOSTINGER_SFTP_DIRECTORY }}'
            test -d "$TARGET" || { echo "Target directory does not exist"; exit 1; }
            rm -rf "$TARGET/assets"
            rm -f "$TARGET/index.html" "$TARGET/version.json" "$TARGET/.htaccess"

      - name: Deploy to Hostinger over SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SFTP_SERVER }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SFTP_PORT }}
          source: "dist"
          target: ${{ secrets.HOSTINGER_SFTP_DIRECTORY }}
          strip_components: 1
          overwrite: true

      - name: Verify files on Hostinger server
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.HOSTINGER_SFTP_SERVER }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SFTP_PORT }}
          envs: EXPECTED_SHA
          script: |
            TARGET='${{ secrets.HOSTINGER_SFTP_DIRECTORY }}'
            echo "Checking deployed files in configured target"
            test -f "$TARGET/index.html" || { echo "index.html missing from target"; exit 1; }
            test -f "$TARGET/version.json" || { echo "version.json missing from target"; exit 1; }
            cat "$TARGET/version.json"
            grep -q "$EXPECTED_SHA" "$TARGET/version.json" || {
              echo "Configured target does not contain the current deployment marker"
              exit 1
            }

      - name: Verify live staging URL
        run: |
          sleep 5
          LIVE_VERSION="$(curl -fsSL --retry 3 --retry-delay 2 'https://magenta-alpaca-240997.hostingersite.com/version.json?commit=${GITHUB_SHA}')"
          echo "$LIVE_VERSION"
          echo "$LIVE_VERSION" | grep -q "$GITHUB_SHA" || {
            echo "Live domain is not serving files from HOSTINGER_SFTP_DIRECTORY"
            exit 1
          }
